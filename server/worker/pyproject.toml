[project]
name = "gist-worker"
version = "0.1.0"
description = "AI document summarization service — batched, autoscaled, observed"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "transformers>=4.45",
    "torch>=2.4",
    "pydantic-settings>=2.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
